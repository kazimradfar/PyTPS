name: PyTPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build the Windows program"
        type: boolean
        default: true
      publish:
        description: "Publish the release (untick for a test build only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries for Qt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: Mouse editing of fields with real mouse events (from source)
        run: |
          rc=0; python -m pytps --self-test-gui gui_selftest.json || rc=$?
          cat gui_selftest.json; exit $rc
      - name: Screenshots
        run: |
          mkdir -p shots
          python -m pytps --phantom "Thorax (lung tumour)" --size 1366x768 --screenshot shots/thorax_1366.png
          python -m pytps --phantom "Head and neck" --size 1920x1080 --workspace Contouring --screenshot shots/hn_1920.png
          python -m pytps --phantom "Pelvis (prostate)" --size 1366x768 --layout 1+3 --workspace Contouring --screenshot shots/pelvis_1p3.png
          python -m pytps --phantom "Whole body 90 cm (TBI)" --size 1600x900 --screenshot shots/tbi.png
          python -m pytps --size 1366x768 --screenshot shots/empty.png
          python -m pytps --phantom "Thorax (lung tumour)" --demo-plan 0,60,180,300 --workspace Planning --size 1366x768 --screenshot shots/thorax_plan.png
          python -m pytps --phantom "Pelvis (prostate)" --demo-plan 0,90,180,270 --dose-mode wash --workspace Evaluation --size 1920x1080 --screenshot shots/pelvis_box.png
          python -m pytps --phantom "Breast (left)" --demo-plan 305,125 --size 1600x900 --layout 1+3 --screenshot shots/breast.png
          python -m pytps --phantom "Pelvis (prostate)" --demo-plan 0,52,104,156,204,256,308 --optimise 60 --workspace Planning --size 1600x900 --screenshot shots/prostate_imrt.png
          python -m pytps --phantom "Thorax (lung tumour)" --demo-plan 0 --arc --optimise 40 --workspace Evaluation --size 1600x900 --screenshot shots/lung_vmat.png
          python -m pytps --phantom "Head and neck" --demo-plan 0 --arc --optimise 40 --workspace Planning --layout 1+3 --size 1920x1080 --screenshot shots/hn_vmat.png
          python -m pytps --guide-tbi --size 1920x1080 --beam-tab Room --screenshot shots/tbi_guide.png
          python -m pytps --phantom "Pelvis (prostate)" --demo-plan 0,90,180,270 --beam-tab Room --size 1600x900 --screenshot shots/room.png
          python -m pytps --phantom "Pelvis (prostate)" --demo-plan 0,90,180,270 --dose-mode wash --layout 1+3 --size 1600x900 --screenshot shots/wash_legend.png
          python -m pytps --phantom "Thorax (lung tumour)" --demo-plan 0,60,180,300 --layout 1 --main-view 3D --size 1366x768 --screenshot shots/single_3d.png
          python -m pytps --phantom "Pelvis (prostate)" --demo-plan 0,90,180,270 --export shots/pelvis --size 1366x768 --screenshot shots/pelvis_export.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytps-screenshots
          path: shots
      - name: Publish screenshots to the ci-shots branch (for review)
        if: always() && github.event_name == 'push'
        run: |
          cd shots
          git init -q && git checkout -q -b ci-shots
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots

  windows:
    # builds only on request: Actions > PyTPS > Run workflow (branch main, "Build the Windows program" ticked);
    # pushes run the tests and screenshots only
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build PyTPS.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name PyTPS --icon pytps/resources/pytps.ico --add-data "pytps/resources;pytps/resources" --add-data "docs;docs" --add-data "LICENSE;." --add-data "THIRD_PARTY_LICENSES.md;." --collect-submodules pydicom --collect-submodules skimage.measure run_pytps.py
      - name: Self-test of the built program
        shell: pwsh
        run: |
          $p = Start-Process dist\PyTPS\PyTPS.exe -ArgumentList "--self-test", "$env:GITHUB_WORKSPACE\built_selftest.json" -Wait -PassThru
          Get-Content "$env:GITHUB_WORKSPACE\built_selftest.json"
          "{0:N0} MB" -f ((Get-ChildItem dist\PyTPS -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed ($($p.ExitCode))"; exit 1 }
      - name: Mouse editing of fields in the built program (native Windows platform) and from source
        shell: pwsh
        run: |
          $p = Start-Process dist\PyTPS\PyTPS.exe -ArgumentList "--self-test-gui", "$env:GITHUB_WORKSPACE\built_gui.json" -Wait -PassThru
          "--- built program"; Get-Content "$env:GITHUB_WORKSPACE\built_gui.json"
          python -m pip install -q -r requirements.txt
          python -m pytps --self-test-gui "$env:GITHUB_WORKSPACE\source_gui.json"
          "--- from source"; Get-Content "$env:GITHUB_WORKSPACE\source_gui.json"
          if ($p.ExitCode -ne 0) { Write-Error "mouse editing failed in the built program"; exit 1 }
      - name: Build setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = python -c "import pytps; print(pytps.__version__)"
          & $iscc /Q "/DAppVersion=$v" installer\pytps.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer_out | Format-Table Name, Length
      - name: Install silently, self-test the installed program, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer_out\PyTPS_Setup_v*.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "setup failed"; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\PyTPS"
          $t = Start-Process "$app\PyTPS.exe" -ArgumentList "--self-test", "$env:GITHUB_WORKSPACE\installed_selftest.json" -Wait -PassThru
          Get-Content "$env:GITHUB_WORKSPACE\installed_selftest.json"
          if ($t.ExitCode -ne 0) { Write-Error "installed program failed its self-test"; exit 1 }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$app\PyTPS.exe") { Write-Error "program still present after uninstall"; exit 1 }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\PyTPS -DestinationPath installer_out\PyTPS_portable.zip
      - name: Publish release (tag v<version>, marked as the latest release)
        if: inputs.publish
        shell: pwsh
        env:
          # with the repository secret RELEASE_TOKEN (a personal access token) the release is published in the owner's
          # name; without it, by github-actions[bot]
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $v = python -c "import pytps; print(pytps.__version__)"
          $tag = "v$v"
          gh release delete $tag --yes --cleanup-tag 2>$null              # rebuild of the same version replaces it
          $setup = (Get-ChildItem installer_out\PyTPS_Setup_v*.exe)[0].FullName
          $notes = "PyTPS $v - radiotherapy treatment planning system for teaching.`n`n" +
                   "* PyTPS_Setup_v$v.exe - setup wizard for Windows 10/11 64-bit, no administrator rights.`n" +
                   "* PyTPS_portable.zip - unzip and start PyTPS\PyTPS.exe.`n`n" +
                   "Tested on the build machine before publishing: self-test of the built program, silent installation, self-test of the installed program, uninstallation.`n" +
                   "The program is not code-signed, so Windows SmartScreen may show 'unknown publisher' (More info > Run anyway).`n`n" +
                   "Open source (MIT). Built from commit $env:GITHUB_SHA."
          gh release create $tag $setup installer_out\PyTPS_portable.zip --target $env:GITHUB_SHA --latest --title "PyTPS $v" --notes $notes
